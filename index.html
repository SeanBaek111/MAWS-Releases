<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAWS HoloLens Installer</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; background: #111315; color: #f5f7f8; }
    main { width: min(680px, calc(100% - 40px)); margin: 64px auto; }
    h1 { font-size: 32px; margin: 0 0 8px; }
    p { color: #b8bec5; line-height: 1.55; }
    .version { color: #71d6a3; font-weight: 600; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 28px 0; }
    a { color: inherit; }
    .button { padding: 12px 16px; border: 1px solid #3d454c; background: #20252a;
      text-decoration: none; border-radius: 6px; font-weight: 600; }
    .button.primary { background: #f5f7f8; color: #111315; border-color: #f5f7f8; }
    ol { color: #d9dde1; line-height: 1.8; padding-left: 22px; }
    code { color: #9bd7ff; }
  </style>
</head>
<body>
  <main>
    <h1>MAWS</h1>
    <p>HoloLens release <span class="version">1.0.1.0</span></p>
    <div class="actions">
      <a class="button primary" href="MAWS.appinstaller">Install or update MAWS</a>
      <a class="button" href="MAWS.cer">Download signing certificate</a>
    </div>
    <ol>
      <li>On first installation only, install <code>MAWS.cer</code> as a trusted certificate.</li>
      <li>Open <code>MAWS.appinstaller</code> and install MAWS.</li>
      <li>Future launches check this site for a newer signed package before MAWS starts.</li>
    </ol>
  </main>
</body>
</html>
